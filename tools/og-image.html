<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Chalk &amp; Circuits - link preview source</title>
<!--
  Source for assets/og.jpg, the image every link unfurl shows. Rendered at 2x
  so the 1200x630 slot is sharp on a retina screen, then compressed to JPEG:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1200,630 --screenshot=/tmp/og.png \
      --default-background-color=202234ff \
      "file:///$PWD/tools/og-image.html"
    sips -s format jpeg -s formatOptions 92 /tmp/og.png --out assets/og.jpg

  Paths are relative to the repository root, so run it from there.
-->
<style>
@font-face{font-family:'Bricolage Grotesque';font-weight:800;src:url("../assets/fonts/bricolage-grotesque-latin.woff2") format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url("../assets/fonts/ibm-plex-mono-500-latin.woff2") format('woff2')}
@font-face{font-family:'Schibsted Grotesk';font-weight:400;src:url("../assets/fonts/schibsted-grotesk-latin.woff2") format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background-color:#202234;
  background-image:
    linear-gradient(to right,rgba(248,245,235,.05) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(248,245,235,.05) 1px,transparent 1px);
  background-size:40px 40px;
  font-family:'Schibsted Grotesk','Helvetica Neue',Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;position:relative;color:#F8F5EB;
}
.mark{position:absolute;right:-96px;top:50%;transform:translateY(-50%)}
.wrap{position:absolute;left:76px;top:50%;transform:translateY(-50%);display:grid;gap:26px;max-width:780px}
.pm{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:17px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:#E07A5F}
.lockup{display:flex;align-items:flex-start;gap:22px}
h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:96px;font-weight:800;
  line-height:.9;letter-spacing:-.045em;color:#F8F5EB}
h1 .amp{color:#E07A5F}
.lead{font-size:29px;line-height:1.4;color:rgba(248,245,235,.72);max-width:34ch}
.products{margin-top:6px;border-top:1px solid rgba(248,245,235,.18);padding-top:22px}
.products .label{display:block;margin-bottom:16px;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(248,245,235,.45)}
.sub{display:flex;align-items:center;gap:15px}
.sub .name{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:30px;font-weight:800;
  letter-spacing:-.035em;color:#fff}
.sub .desc{font-size:17px;color:rgba(248,245,235,.6)}
.sub .dot{width:5px;height:5px;border-radius:2px;background:rgba(248,245,235,.3)}
</style></head><body>

<svg class="mark" viewBox="0 0 48 48" width="500" height="500" aria-hidden="true">
  <g fill="none" stroke-width="2.6" stroke-linecap="round">
    <path d="M34.96 13.04A15.5 15.5 0 1 0 34.96 34.96" stroke="rgba(248,245,235,.30)"/>
    <path d="M29.8 18.2A8.2 8.2 0 1 0 29.8 29.8" stroke="rgba(224,122,95,.85)"/>
  </g>
  <rect x="22.6" y="22.6" width="2.8" height="2.8" rx=".6" fill="rgba(248,245,235,.40)"/>
</svg>

<div class="wrap">
  <span class="pm">A small, sustainable software shop</span>
  <div class="lockup">
    <svg viewBox="0 0 48 48" width="92" height="92" style="margin-top:8px" aria-label="Chalk &amp; Circuits">
      <rect width="48" height="48" rx="11" fill="#F8F5EB"/>
      <g fill="none" stroke-width="3.6" stroke-linecap="round">
        <path d="M34.96 13.04A15.5 15.5 0 1 0 34.96 34.96" stroke="#3D405B"/>
        <path d="M29.8 18.2A8.2 8.2 0 1 0 29.8 29.8" stroke="#E07A5F"/>
      </g>
      <rect x="22.5" y="22.5" width="3" height="3" rx=".6" fill="#3D405B"/>
    </svg>
    <h1>Chalk <span class="amp">&amp;</span> Circuits</h1>
  </div>
  <p class="lead">Software inspired by life. Simple, fun, useful.</p>
  <div class="products">
    <span class="label">Products</span>
    <div class="sub">
    <svg viewBox="0 0 32 32" width="44" height="44" aria-label="sendtally"><rect width="32" height="32" rx="8" fill="#F9DC5C"></rect><path d="M9.5 22.5 16 16l6.5-6.5" fill="none" stroke="#403F4C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="9.5" cy="22.5" r="3.1" fill="#403F4C"></circle><circle cx="16" cy="16" r="3.1" fill="#403F4C"></circle><circle cx="22.5" cy="9.5" r="3.1" fill="#403F4C"></circle></svg>
    <span class="name">sendtally</span>
    <span class="dot"></span>
    <span class="desc">A climbing log with effort tracking</span>
    </div>
  </div>
</div>
</body></html>
